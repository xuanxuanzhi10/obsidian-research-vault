  <rect x="345" y="92" width="250" height="125" class="box" fill="#e8e1f1"/><text x="390" y="140" class="t">冻结 DINOv2</text><text x="385" y="180" class="s">每视角 10 tokens → g</text>
  <rect x="665" y="72" width="260" height="165" class="box" fill="#f5dfda"/><text x="725" y="125" class="t">触觉预测器</text><text x="705" y="165" class="s">g + VL 前缀 + 查询</text><text x="738" y="205" class="s">→ z（10 tokens）</text>
  <rect x="980" y="92" width="175" height="125" class="box" fill="#eee7ce"/><text x="1014" y="140" class="t">动作专家</text><text x="1005" y="180" class="s">生成 H=50</text>
  <path d="M275 155 H345" class="a"/><path d="M595 155 H665" class="a"/><path d="M925 155 H980" class="a"/>
