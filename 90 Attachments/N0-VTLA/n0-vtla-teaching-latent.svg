<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <style>.t{font:22px sans-serif;fill:#2c2b29}.h{font:bold 28px sans-serif;fill:#201f1d}.s{font:18px sans-serif;fill:#5e5a54}.box{stroke:#948d82;stroke-width:2;rx:18}.a{stroke:#6d675f;stroke-width:3;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6d675f"/></marker></defs>
