  <rect x="665" y="330" width="260" height="125" class="box" fill="#e8e1f1"/><text x="710" y="378" class="t">同一冻结编码器</text><text x="722" y="418" class="s">多视角平均 → z*</text>
  <path d="M595 392 H665" class="a"/><path d="M795 330 V252" class="a"/>
