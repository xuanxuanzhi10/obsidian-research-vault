<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
  <style>.t{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#2d2926}.h{font-size:25px;font-weight:700}.b{font-size:17px}.s{font-size:14px;fill:#6d625b}.yes{fill:#2f8469}.no{fill:#eee9e2}.grid{stroke:#fbf8f2;stroke-width:3}</style>
  <rect width="1120" height="760" fill="#fbf8f2" rx="24"/><text x="55" y="55" class="t h">Block-wise Causal Attention：不是普通下三角，而是“块内双向、块间因果”</text>
  <g transform="translate(280,125)">
    <g class="t b" text-anchor="middle"><text x="40" y="-20">P₁</text><text x="100" y="-20">P₂</text><text x="160" y="-20">P₃</text><text x="220" y="-20">S₁</text><text x="280" y="-20">S₂</text><text x="340" y="-20">A₁</text><text x="400" y="-20">A₂</text><text x="460" y="-20">A₃</text></g>
    <g class="t b" text-anchor="end"><text x="-18" y="38">P₁</text><text x="-18" y="98">P₂</text><text x="-18" y="158">P₃</text><text x="-18" y="218">S₁</text><text x="-18" y="278">S₂</text><text x="-18" y="338">A₁</text><text x="-18" y="398">A₂</text><text x="-18" y="458">A₃</text></g>
    <!-- 8x8 base -->
    <g class="grid">
      <rect x="0" y="0" width="180" height="180" class="yes"/><rect x="180" y="0" width="300" height="180" class="no"/>
      <rect x="0" y="180" width="300" height="120" class="yes"/><rect x="300" y="180" width="180" height="120" class="no"/>
      <rect x="0" y="300" width="480" height="180" class="yes"/>
      <path d="M60 0V480M120 0V480M180 0V480M240 0V480M300 0V480M360 0V480M420 0V480M0 60H480M0 120H480M0 180H480M0 240H480M0 300H480M0 360H480M0 420H480" fill="none" stroke="#fbf8f2" stroke-width="3"/>
    </g>
    <g fill="#fff" font-family="sans-serif" font-size="20" text-anchor="middle">
      <text x="30" y="38">✓</text><text x="90" y="38">✓</text><text x="150" y="38">✓</text><text x="30" y="98">✓</text><text x="90" y="98">✓</text><text x="150" y="98">✓</text><text x="30" y="158">✓</text><text x="90" y="158">✓</text><text x="150" y="158">✓</text>
      <text x="30" y="218">✓</text><text x="90" y="218">✓</text><text x="150" y="218">✓</text><text x="210" y="218">✓</text><text x="270" y="218">✓</text><text x="30" y="278">✓</text><text x="90" y="278">✓</text><text x="150" y="278">✓</text><text x="210" y="278">✓</text><text x="270" y="278">✓</text>
      <text x="30" y="338">✓</text><text x="90" y="338">✓</text><text x="150" y="338">✓</text><text x="210" y="338">✓</text><text x="270" y="338">✓</text><text x="330" y="338">✓</text><text x="390" y="338">✓</text><text x="450" y="338">✓</text>
      <text x="30" y="398">✓</text><text x="90" y="398">✓</text><text x="150" y="398">✓</text><text x="210" y="398">✓</text><text x="270" y="398">✓</text><text x="330" y="398">✓</text><text x="390" y="398">✓</text><text x="450" y="398">✓</text>
      <text x="30" y="458">✓</text><text x="90" y="458">✓</text><text x="150" y="458">✓</text><text x="210" y="458">✓</text><text x="270" y="458">✓</text><text x="330" y="458">✓</text><text x="390" y="458">✓</text><text x="450" y="458">✓</text>
    </g>
  </g>
  <g class="t"><text x="85" y="170" class="b" fill="#2f8469">行 = Query</text><text x="85" y="200" class="s">“我现在要看谁？”</text><text x="815" y="170" class="b">列 = Key / Value</text><text x="815" y="200" class="s">“谁能被我读取？”</text>
    <rect x="75" y="600" width="970" height="105" fill="#fff" stroke="#d9d0c7" rx="16"/><text x="105" y="637" class="b">读图结论：</text><text x="105" y="670" class="b">P 永远看不到机器人状态与噪声动作；S 可看 P；A 可看完整条件，而且 A 块内部彼此可见。</text><text x="105" y="695" class="s">因此条件前缀保持稳定，可缓存 P/S 的 K,V；每个 Flow solver step 主要更新动作块。</text></g>
</svg>
