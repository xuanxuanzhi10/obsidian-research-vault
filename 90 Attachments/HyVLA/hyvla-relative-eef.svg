<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#70635a"/></marker><style>.t{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#2d2926}.h{font-size:25px;font-weight:700}.b{font-size:18px}.s{font-size:14px;fill:#6d625b}.bx{stroke-width:2;rx:16}.ar{stroke:#70635a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
 <rect width="1200" height="650" fill="#fbf8f2" rx="24"/><text x="55" y="55" class="t h">Relative EEF：统一的是“末端意图”，不是每台机器人的关节</text>
 <rect x="75" y="125" width="290" height="170" fill="#f7ead7" stroke="#c89452" class="bx"/><g class="t" text-anchor="middle"><text x="220" y="168" class="b">Policy 输出</text><text x="220" y="205" class="s">Δposition 3D</text><text x="220" y="232" class="s">Δrotation 6D</text><text x="220" y="259" class="s">gripper 1D</text></g>
 <path d="M365 210H485" class="ar"/><rect x="500" y="125" width="210" height="170" fill="#e4ecfa" stroke="#6687bc" class="bx"/><g class="t" text-anchor="middle"><text x="605" y="175" class="b">坐标组合 + IK</text><text x="605" y="210" class="s">当前 EEF pose</text><text x="605" y="237" class="s">+ 相对目标</text><text x="605" y="264" class="s">→ robot joints</text></g>
 <path d="M710 175H825M710 245H825" class="ar"/><g class="t" text-anchor="middle"><rect x="840" y="105" width="280" height="120" fill="#dff1ed" stroke="#56947f" class="bx"/><text x="980" y="150" class="b">Robot A joints</text><text x="980" y="184" class="s">例如 6-DoF arm</text><rect x="840" y="245" width="280" height="120" fill="#eee7f7" stroke="#8c73b0" class="bx"/><text x="980" y="290" class="b">Robot B joints</text><text x="980" y="324" class="s">例如 humanoid dual-arm</text></g>
 <rect x="85" y="445" width="1030" height="125" fill="#fff" stroke="#d9d0c7" class="bx"/><text x="115" y="486" class="t b">抽掉了什么：</text><text x="275" y="486" class="t s">joint 维度与拓扑差异</text><text x="115" y="525" class="t b">仍然存在：</text><text x="275" y="525" class="t s">可达域、IK 奇异点、碰撞、动力学、躯干/头部协调</text><text x="600" y="554" text-anchor="middle" class="t s">因此 embodiment-agnostic interface ≠ arbitrary zero-shot embodiment transfer</text>
</svg>
