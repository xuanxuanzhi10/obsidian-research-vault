<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#6e6259"/></marker><style>.t{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#2d2926}.h{font-size:25px;font-weight:700}.b{font-size:18px}.s{font-size:14px;fill:#6d625b}.ar{stroke:#6e6259;stroke-width:3;fill:none;marker-end:url(#a)}.bx{stroke-width:2;rx:15}</style></defs>
  <rect width="1200" height="760" fill="#fbf8f2" rx="24"/><text x="55" y="55" class="t h">从噪声动作到不断档执行：生成速度与伺服速度是两件事</text>
  <g class="t" text-anchor="middle"><rect x="70" y="110" width="170" height="105" fill="#eee7f7" stroke="#8c73b0" class="bx"/><text x="155" y="150" class="b">高斯噪声 ε</text><text x="155" y="182" class="s">τ = 0</text>
    <rect x="330" y="100" width="250" height="125" fill="#f7ead7" stroke="#c89452" class="bx"/><text x="455" y="143" class="b">Action Expert</text><text x="455" y="174" class="s">条件：图像 / 文本 / 状态</text><text x="455" y="200" class="s">预测速度场 vθ</text>
    <rect x="680" y="110" width="190" height="105" fill="#e4ecfa" stroke="#6687bc" class="bx"/><text x="775" y="150" class="b">Euler × 10</text><text x="775" y="182" class="s">Δτ = 0.1</text>
    <rect x="970" y="110" width="170" height="105" fill="#dff1ed" stroke="#56947f" class="bx"/><text x="1055" y="150" class="b">动作块 A</text><text x="1055" y="182" class="s">τ = 1</text></g>
  <path d="M240 162H320" class="ar"/><path d="M580 162H670" class="ar"/><path d="M870 162H960" class="ar"/>
  <rect x="65" y="270" width="1070" height="75" fill="#fff3ef" stroke="#c47b6f" rx="14"/><text x="600" y="302" text-anchor="middle" class="t b">公式核对：Aτ = τA + (1−τ)ε 的正向速度应是 A−ε；论文 Eq.(3) 写反，但 Sec.4.2 又写成 A−ε。</text><text x="600" y="329" text-anchor="middle" class="t s">复现时应查官方代码；不能把这一处排版/定义冲突静默抹掉。</text>
  <text x="60" y="410" class="t h">异步执行时间线</text>
  <g class="t"><text x="65" y="470" class="b">推理线程</text><text x="65" y="580" class="b">50 Hz 执行线程</text></g>
  <g><rect x="210" y="440" width="260" height="55" fill="#eee7f7" stroke="#8c73b0" rx="10"/><text x="340" y="474" text-anchor="middle" class="t b">生成 chunk ①</text><rect x="500" y="440" width="260" height="55" fill="#eee7f7" stroke="#8c73b0" rx="10"/><text x="630" y="474" text-anchor="middle" class="t b">生成 chunk ②</text><rect x="790" y="440" width="260" height="55" fill="#eee7f7" stroke="#8c73b0" rx="10"/><text x="920" y="474" text-anchor="middle" class="t b">生成 chunk ③</text></g>
  <path d="M205 570H1090" stroke="#6e6259" stroke-width="4" marker-end="url(#a)"/><g fill="#56947f"><circle cx="230" cy="570" r="9"/><circle cx="280" cy="570" r="9"/><circle cx="330" cy="570" r="9"/><circle cx="380" cy="570" r="9"/><circle cx="430" cy="570" r="9"/><circle cx="480" cy="570" r="9"/><circle cx="530" cy="570" r="9"/><circle cx="580" cy="570" r="9"/><circle cx="630" cy="570" r="9"/><circle cx="680" cy="570" r="9"/><circle cx="730" cy="570" r="9"/><circle cx="780" cy="570" r="9"/><circle cx="830" cy="570" r="9"/><circle cx="880" cy="570" r="9"/><circle cx="930" cy="570" r="9"/><circle cx="980" cy="570" r="9"/><circle cx="1030" cy="570" r="9"/></g>
  <path d="M470 495V540M760 495V540" class="ar"/><text x="470" y="630" text-anchor="middle" class="t s">新 chunk 到达：删 stale prefix，Bézier 接到未来内部点</text><text x="760" y="660" text-anchor="middle" class="t b">50 Hz 是“取 buffer 的频率”，不是“4B 模型每秒 forward 50 次”。</text><text x="760" y="690" text-anchor="middle" class="t s">论文没有报告实际 backbone latency、GPU、显存或 replanning rate。</text>
</svg>
