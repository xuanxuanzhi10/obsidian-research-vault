<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><rect width="1100" height="420" fill="#fbf8f1" rx="18"/><style>text{font-family:Inter,'Noto Sans SC',sans-serif;fill:#28251f}.h{font-size:24px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#665f55}.b{fill:#fff;stroke:#d4c7b7;stroke-width:2}.a{stroke:#477f8e;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#477f8e"/></marker></defs><text x="45" y="48" class="h">一个 chunk 内的因果级联</text><rect class="b" x="45" y="95" width="300" height="220" rx="14"/><text x="83" y="140" class="h">Phase A：预测未来</text><text x="75" y="190" class="t">Video ↔ Tactile 联合去噪</text><text x="75" y="235" class="t">同帧互相注意、保持一致</text><text x="75" y="280" class="s">不读取当前 chunk 的 action</text><path class="a" d="M355 205H455"/><rect class="b" x="465" y="95" width="230" height="220" rx="14"/><text x="515" y="140" class="h">冻结预测 KV</text><text x="495" y="195" class="t">5B 视频分支</text><text x="495" y="235" class="t">无需重复计算</text><text x="495" y="280" class="s">信息方向产生缓存收益</text><path class="a" d="M705 205H805"/><rect class="b" x="815" y="95" width="240" height="220" rx="14"/><text x="840" y="140" class="h">Phase B：生成动作</text><text x="842" y="190" class="t">Action 读取预测未来</text><text x="842" y="235" class="t">+ 当前观测触觉</text><text x="842" y="280" class="s">短步表反复去噪</text><text x="255" y="375" class="t">先回答“会发生什么”，再回答“现在该怎么动”</text></svg>
