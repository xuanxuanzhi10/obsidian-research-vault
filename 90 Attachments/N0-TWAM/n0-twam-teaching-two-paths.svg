<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" fill="#fbf8f1" rx="18"/><style>text{font-family:Inter,'Noto Sans SC',sans-serif;fill:#28251f}.h{font-size:24px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#665f55}.b1{fill:#eaf3f5;stroke:#77a6b1;stroke-width:2}.b2{fill:#f5ece5;stroke:#b98561;stroke-width:2}.a1{stroke:#578b98;stroke-width:4;fill:none;marker-end:url(#m1)}.a2{stroke:#b27850;stroke-width:4;fill:none;marker-end:url(#m2)}</style><defs><marker id="m1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#578b98"/></marker><marker id="m2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b27850"/></marker></defs><text x="45" y="48" class="h">同一种触觉，两条不同时间方向的路径</text><rect class="b1" x="50" y="95" width="340" height="240" rx="14"/><text x="88" y="140" class="h">预测路径：未来 → 现在</text><text x="85" y="195" class="t">VAE tactile latent residual</text><text x="85" y="240" class="t">与未来视频共同生成</text><text x="85" y="285" class="s">接触前：预判滑移、卡住、落座</text><path class="a1" d="M400 215H520"/><rect x="530" y="155" width="220" height="120" rx="14" fill="#fff" stroke="#cdbfae" stroke-width="2"/><text x="565" y="205" class="h">Action Expert</text><text x="590" y="245" class="t">融合两条路径</text><rect class="b2" x="810" y="95" width="240" height="240" rx="14"/><text x="835" y="140" class="h">观测路径：现在</text><text x="840" y="195" class="t">三轴 force map</text><text x="840" y="240" class="t">NeoForce encoder</text><text x="840" y="285" class="s">接触后：纠错与恢复</text><path class="a2" d="M800 215H765"/><text x="330" y="390" class="t">预测是模型信念；观测是现实校正。两者缺一都会在消融中下降。</text></svg>
