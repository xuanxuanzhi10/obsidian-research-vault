<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <style>.h{font:bold 28px sans-serif;fill:#262421}.t{font:21px sans-serif;fill:#302d29}.s{font:17px sans-serif;fill:#655f57}.box{stroke:#958c81;stroke-width:2;rx:18}.a{stroke:#716a62;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#716a62"/></marker></defs>
  <text x="45" y="48" class="h">Flow Matching：训练随机抽一个中间点，推理沿速度场走十步</text>
  <text x="55" y="105" class="t">训练</text>
  <rect x="55" y="135" width="180" height="110" class="box" fill="#e4edf2"/><text x="91" y="179" class="t">噪声 ε</text><text x="86" y="214" class="s">τ=0</text>
  <rect x="315" y="135" width="250" height="110" class="box" fill="#ece2f1"/><text x="346" y="176" class="t">Aτ = τA+(1−τ)ε</text><text x="346" y="214" class="s">整块 shape [H=50, D]</text>
  <rect x="645" y="135" width="235" height="110" class="box" fill="#f4dfd9"/><text x="680" y="176" class="t">Action Expert</text><text x="677" y="214" class="s">输入条件、Aτ、τ</text>
  <rect x="960" y="135" width="190" height="110" class="box" fill="#e6ecd7"/><text x="993" y="176" class="t">预测 vθ</text><text x="982" y="214" class="s">拟合 A−ε</text>
  <path d="M235 190H315" class="a"/><path d="M565 190H645" class="a"/><path d="M880 190H960" class="a"/>
  <text x="55" y="325" class="t">推理</text>
  <circle cx="125" cy="415" r="39" fill="#dceaf0" stroke="#8a9ca4" stroke-width="2"/><text x="107" y="422" class="t">ε</text>
  <circle cx="325" cy="415" r="31" fill="#e9e2ef" stroke="#95879f" stroke-width="2"/><text x="306" y="422" class="s">A.1</text>
  <circle cx="525" cy="415" r="31" fill="#e9e2ef" stroke="#95879f" stroke-width="2"/><text x="506" y="422" class="s">A.2</text>
  <text x="660" y="422" class="h">⋯</text>
  <circle cx="855" cy="415" r="31" fill="#e9e2ef" stroke="#95879f" stroke-width="2"/><text x="836" y="422" class="s">A.9</text>
  <circle cx="1080" cy="415" r="45" fill="#e5ecd4" stroke="#8a9670" stroke-width="2"/><text x="1042" y="422" class="t">动作 A</text>
  <path d="M165 415H294" class="a"/><path d="M356 415H494" class="a"/><path d="M556 415H645" class="a"/><path d="M695 415H824" class="a"/><path d="M886 415H1035" class="a"/>
  <text x="80" y="500" class="s">每一步：A ← A + 0.1·vθ(A, observation, τ)</text><text x="80" y="535" class="s">允许：50 个 action tokens 在块内共同协调；失败路径：把 H 步自回归离散解码，会把控制频率变成串行瓶颈。</text><text x="80" y="570" class="s">教学示意图（根据论文 Section IV 与 Appendix B 绘制）</text>
</svg>
