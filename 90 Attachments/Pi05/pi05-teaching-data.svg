<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#faf8f3"/>
  <style>.title{font:700 29px sans-serif;fill:#292622}.h{font:700 18px sans-serif;fill:#292622}.t{font:15px sans-serif;fill:#514b44}.box{fill:#fff;stroke:#c9bca9;stroke-width:2}.arrow{stroke:#8f6946;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8f6946"/></marker></defs>
  <text x="60" y="55" class="title">六类数据不是堆在一起，而是在补不同的“缺口”</text>
  <g>
    <rect x="55" y="95" width="280" height="72" rx="12" class="box"/><text x="75" y="125" class="h">MM · 移动操作，多家庭</text><text x="75" y="150" class="t">目标 embodiment + 真实长任务落地</text>
    <rect x="55" y="185" width="280" height="72" rx="12" class="box"/><text x="75" y="215" class="h">ME · 静态机械臂，多环境</text><text x="75" y="240" class="t">环境变化，而非只记目标机器人场景</text>
    <rect x="55" y="275" width="280" height="72" rx="12" class="box"/><text x="75" y="305" class="h">CE · 跨 embodiment / 实验室</text><text x="75" y="330" class="t">扩大技能与机器人形态覆盖</text>
    <rect x="55" y="365" width="280" height="72" rx="12" class="box"/><text x="75" y="395" class="h">HL · 子任务 + bounding box</text><text x="75" y="420" class="t">把“看懂”接到“下一步该做什么”</text>
    <rect x="55" y="455" width="280" height="72" rx="12" class="box"/><text x="75" y="485" class="h">WD · 网页 VQA / caption / 定位</text><text x="75" y="510" class="t">开放词汇与未见物体语义</text>
    <rect x="55" y="545" width="280" height="72" rx="12" class="box"/><text x="75" y="575" class="h">VI · 人给低层策略口头指令</text><text x="75" y="600" class="t">教高层策略什么子任务真正可执行</text>
  </g>
  <g>
    <path d="M335 131 C470 131 480 225 560 225" class="arrow"/><path d="M335 221 C470 221 480 255 560 255" class="arrow"/><path d="M335 311 C470 311 480 285 560 285" class="arrow"/>
    <path d="M335 401 C470 401 480 380 560 380" class="arrow"/><path d="M335 491 C470 491 480 410 560 410" class="arrow"/><path d="M335 581 C470 581 480 440 560 440" class="arrow"/>
  </g>
  <rect x="560" y="175" width="270" height="315" rx="18" fill="#f1ece4" stroke="#b79f83" stroke-width="2"/>
  <text x="695" y="218" text-anchor="middle" class="h">同一个 π₀.5 参数系统</text>
  <text x="695" y="263" text-anchor="middle" class="t">共享图像 / 语言 / 状态表示</text>
  <text x="695" y="305" text-anchor="middle" class="t">共享 next-token 接口</text>
  <text x="695" y="347" text-anchor="middle" class="t">学习高层子任务预测</text>
  <text x="695" y="389" text-anchor="middle" class="t">再接 Flow Action Expert</text>
  <text x="695" y="445" text-anchor="middle" class="h">不是每类数据都直接教 action</text>
  <path d="M830 260 H930" class="arrow"/><path d="M830 405 H930" class="arrow"/>
  <rect x="930" y="205" width="220" height="110" rx="14" fill="#e8f1ef" stroke="#8bb1a8" stroke-width="2"/>
  <text x="1040" y="245" text-anchor="middle" class="h">开放世界识别</text><text x="1040" y="277" text-anchor="middle" class="t">陌生物体 / 指令 / 场景</text>
  <rect x="930" y="350" width="220" height="110" rx="14" fill="#ece6f5" stroke="#a58bc2" stroke-width="2"/>
  <text x="1040" y="390" text-anchor="middle" class="h">可执行的长任务</text><text x="1040" y="422" text-anchor="middle" class="t">子任务 → 连续动作</text>
  <text x="600" y="665" text-anchor="middle" class="t">教学图：按论文数据定义与消融结果整理，并非论文原图。</text>
</svg>
