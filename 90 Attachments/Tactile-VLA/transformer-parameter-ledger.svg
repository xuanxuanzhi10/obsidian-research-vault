<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430"><rect width="1120" height="430" fill="#fbf8f1" rx="18"/><style>text{font-family:Inter,'Noto Sans SC',sans-serif;fill:#29251f}.h{font-size:24px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#655e55}.b{fill:#fff;stroke:#d6c8b7;stroke-width:2}.n{fill:#e9f2f3;stroke:#719aa3;stroke-width:2}.a{stroke:#a96b43;stroke-width:3}</style><text x="40" y="45" class="h">FTP-1 Tactile Expert：按矩阵记账，而不是硬套 12Ld²</text><rect class="b" x="45" y="85" width="285" height="255" rx="14"/><text x="75" y="125" class="h">官方配置</text><text x="75" y="168" class="t">d = 1024, L = 18</text><text x="75" y="208" class="t">Q heads = 8, KV heads = 1</text><text x="75" y="248" class="t">head_dim = 256</text><text x="75" y="288" class="t">d_ff = 4096（gated）</text><text x="75" y="320" class="s">1 KV head → MQA</text><rect class="n" x="405" y="85" width="300" height="255" rx="14"/><text x="440" y="125" class="h">每层主参数</text><text x="440" y="175" class="t">Q/K/V/O ≈ 4.72M</text><text x="440" y="220" class="t">gate/up/down ≈ 12.58M</text><text x="440" y="265" class="h">合计 ≈ 17.30M</text><text x="440" y="310" class="s">norm / bias 为小项</text><rect class="b" x="780" y="85" width="295" height="255" rx="14"/><text x="820" y="125" class="h">18 层结果</text><text x="820" y="195" class="h">≈ 311.4M</text><text x="820" y="245" class="t">官方配置标注 311M</text><text x="820" y="295" class="s">论文简称约 300M</text><line class="a" x1="340" y1="212" x2="395" y2="212"/><line class="a" x1="715" y1="212" x2="770" y2="212"/><text x="235" y="390" class="t">关键：非标准 head_dim + MQA + gated FFN，三处都改变速算结果</text></svg>
