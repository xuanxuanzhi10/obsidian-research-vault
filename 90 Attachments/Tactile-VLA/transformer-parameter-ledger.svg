<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430"><rect width="1120" height="430" fill="#fbf8f1" rx="18"/><style>text{font-family:Inter,'Noto Sans SC',sans-serif;fill:#29251f}.h{font-size:24px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#655e55}.b{fill:#fff;stroke:#d6c8b7;stroke-width:2}.n{fill:#e9f2f3;stroke:#719aa3;stroke-width:2}.a{stroke:#a96b43;stroke-width:3}</style><text x="40" y="45" class="h">FTP-1 Tactile Expert：按矩阵记账，而不是硬套 12Ld²</text><rect class="b" x="45" y="85" width="285" height="255" rx="14"/><text x="75" y="125" class="h">已知配置</text><text x="75" y="170" class="t">d_model = 1024</text><text x="75" y="210" class="t">heads = 8</text><text x="75" y="250" class="t">head_dim = 256</text><text x="75" y="290" class="t">d_ff = 4096, L = 18</text><rect class="n" x="405" y="85" width="300" height="255" rx="14"/><text x="440" y="125" class="h">每层主参数</text><text x="440" y="175" class="t">d_attn = 8×256 = 2048</text><text x="440" y="220" class="t">Q/K/V/O ≈ 8.39M</text><text x="440" y="265" class="t">两矩阵 FFN ≈ 8.39M</text><text x="440" y="310" class="s">bias / norm 为较小项</text><rect class="b" x="780" y="85" width="295" height="255" rx="14"/><text x="820" y="125" class="h">18 层结果</text><text x="820" y="195" class="h">≈ 302M</text><text x="820" y="245" class="t">对应论文“300M”</text><text x="820" y="295" class="s">若 FFN 为 gated，需重算</text><line class="a" x1="340" y1="212" x2="395" y2="212"/><line class="a" x1="715" y1="212" x2="770" y2="212"/><text x="315" y="390" class="t">关键：这里 d_attn ≠ d_model，所以 4d² 假设不成立</text></svg>
