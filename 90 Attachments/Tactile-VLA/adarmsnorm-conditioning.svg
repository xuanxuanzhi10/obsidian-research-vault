<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420"><rect width="1120" height="420" fill="#fbf8f1" rx="18"/><style>text{font-family:Inter,'Noto Sans SC',sans-serif;fill:#29251f}.h{font-size:24px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#655e55}.b{fill:#fff;stroke:#d6c8b7;stroke-width:2}.c{fill:#eee9f5;stroke:#8c79a5;stroke-width:2}.a{stroke:#548993;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#548993"/></marker></defs><text x="40" y="45" class="h">AdaRMSNorm：condition 不占一个座位，而是调节每层通道</text><rect class="c" x="45" y="90" width="260" height="190" rx="14"/><text x="80" y="130" class="h">Condition</text><text x="80" y="180" class="t">proprio → Fourier + MLP</text><text x="80" y="220" class="t">flow timestep features</text><text x="80" y="255" class="s">concat 后生成调制量</text><path class="a" d="M315 185H430"/><rect class="b" x="440" y="90" width="260" height="190" rx="14"/><text x="475" y="130" class="h">RMSNorm + modulation</text><text x="475" y="180" class="t">x̂ = x / rms(x)</text><text x="475" y="220" class="t">y = scale(c)⊙x̂ + shift(c)</text><text x="475" y="255" class="s">实现也可能带 residual gate</text><path class="a" d="M710 185H825"/><rect class="b" x="835" y="90" width="240" height="190" rx="14"/><text x="875" y="130" class="h">Attention block</text><text x="875" y="180" class="t">所有 N 个 tokens</text><text x="875" y="220" class="t">每层直接受条件影响</text><text x="875" y="255" class="s">不等于普通 condition token</text><text x="235" y="360" class="t">FTP-1 已确认注入位置；scale/shift/gate 的确切组合仍需官方实现</text></svg>
