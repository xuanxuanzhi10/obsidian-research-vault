<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500"><rect width="1180" height="500" fill="#fbf8f1" rx="18"/><style>text{font-family:Inter,'Noto Sans SC',sans-serif;fill:#29251f}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#665f55}.p{fill:#e8f1f3;stroke:#719aa3;stroke-width:2}.st{fill:#f4eadf;stroke:#b47c54;stroke-width:2}.a{fill:#eee9f5;stroke:#8e79a5;stroke-width:2}.n{fill:#fff;stroke:#cfc2b2;stroke-width:2}.arr{stroke:#647b75;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#647b75"/></marker></defs><text x="35" y="42" class="h">State 与 flow timestep 是两条独立条件轴</text><text x="75" y="88" class="h">π0</text><rect class="st" x="150" y="60" width="180" height="55" rx="10"/><text x="180" y="94" class="t">continuous state token</text><rect class="a" x="450" y="60" width="210" height="55" rx="10"/><text x="475" y="94" class="t">action ⊕ τ → MLP</text><path class="arr" d="M340 87H440"/><text x="760" y="94" class="s">无 AdaRMS</text><text x="75" y="185" class="h">π0.5</text><rect class="p" x="150" y="155" width="250" height="60" rx="10"/><text x="170" y="191" class="t">prompt + discrete state tokens</text><rect class="a" x="500" y="155" width="220" height="60" rx="10"/><text x="535" y="191" class="t">action tokens</text><rect class="n" x="800" y="155" width="250" height="60" rx="10"/><text x="830" y="191" class="t">AdaRMS condition = τ</text><path class="arr" d="M410 185H490"/><path class="arr" d="M790 185H730"/><text x="75" y="295" class="h">HyVLA</text><rect class="p" x="150" y="265" width="190" height="60" rx="10"/><text x="185" y="301" class="t">P: image + text</text><rect class="st" x="440" y="265" width="190" height="60" rx="10"/><text x="495" y="301" class="t">S: state block</text><rect class="a" x="730" y="265" width="190" height="60" rx="10"/><text x="770" y="301" class="t">A: noisy action</text><path class="arr" d="M350 295H430"/><path class="arr" d="M640 295H720"/><text x="950" y="301" class="s">论文未报告 AdaRMS</text><text x="75" y="405" class="h">FTP-1</text><rect class="st" x="150" y="375" width="210" height="60" rx="10"/><text x="180" y="411" class="t">proprio → encoder</text><rect class="n" x="475" y="375" width="270" height="60" rx="10"/><text x="500" y="411" class="t">AdaRMS condition = state + τ</text><rect class="a" x="860" y="375" width="190" height="60" rx="10"/><text x="900" y="411" class="t">Action Expert</text><path class="arr" d="M370 405H465"/><path class="arr" d="M755 405H850"/><text x="315" y="475" class="s">教学示意：同样叫“条件注入”，信息载体与职责可以完全不同</text></svg>
