<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#faf8f3"/>
  <style>.title{font:700 29px sans-serif;fill:#292622}.h{font:700 19px sans-serif;fill:#292622}.t{font:16px sans-serif;fill:#514b44}.s{font:14px sans-serif;fill:#655e56}.box{fill:#fff;stroke:#c9bca9;stroke-width:2}.line{stroke:#8f6946;stroke-width:3}.bad{fill:#f6d9d5;stroke:#c78076}.good{fill:#dcebe7;stroke:#7aa99d}</style>
  <text x="55" y="52" class="title">为什么 int8 权重更精确，真实机器人反而更差？</text>
  <text x="55" y="98" class="h">训练数据节拍：Bridge controller 约 5 Hz，每 200 ms 来一个动作</text>
  <line x1="90" y1="145" x2="1120" y2="145" class="line"/>
  <g class="t" text-anchor="middle"><text x="140" y="132">t₀</text><text x="340" y="132">t₁</text><text x="540" y="132">t₂</text><text x="740" y="132">t₃</text><text x="940" y="132">t₄</text></g>
  <g fill="#8f6946"><circle cx="140" cy="145" r="7"/><circle cx="340" cy="145" r="7"/><circle cx="540" cy="145" r="7"/><circle cx="740" cy="145" r="7"/><circle cx="940" cy="145" r="7"/></g>
  <text x="55" y="215" class="h">较快的 bfloat16 / int4：推理节拍接近训练分布</text>
  <g class="good"><rect x="90" y="245" width="170" height="70" rx="10"/><rect x="290" y="245" width="170" height="70" rx="10"/><rect x="490" y="245" width="170" height="70" rx="10"/><rect x="690" y="245" width="170" height="70" rx="10"/></g>
  <g class="t" text-anchor="middle"><text x="175" y="275">预测 a₀</text><text x="175" y="298">继续执行旧动作</text><text x="375" y="275">预测 a₁</text><text x="375" y="298">更新及时</text><text x="575" y="275">预测 a₂</text><text x="575" y="298">系统动态接近训练</text><text x="775" y="275">预测 a₃</text></g>
  <text x="55" y="380" class="h">较慢的 int8（A5000 上约 1.2 Hz）：非阻塞执行使动作保持时间改变</text>
  <g class="bad"><rect x="90" y="410" width="500" height="80" rx="10"/><rect x="610" y="410" width="500" height="80" rx="10"/></g>
  <g class="t" text-anchor="middle"><text x="340" y="444">模型仍在算下一步</text><text x="340" y="470">机器人长时间继续执行上一动作</text><text x="860" y="444">终于得到新动作</text><text x="860" y="470">但状态已偏离训练时的时序分布</text></g>
  <rect x="135" y="535" width="930" height="65" rx="14" fill="#efe7dc" stroke="#c9bca9"/>
  <text x="600" y="562" text-anchor="middle" class="h">Blocking control 强制等动作执行完再预测后，三种精度表现相近</text>
  <text x="600" y="588" text-anchor="middle" class="s">所以原 int8 降分主要是控制时序/吞吐问题，不足以归因于量化精度损失。</text>
  <text x="600" y="635" text-anchor="middle" class="s">教学示意图（根据 Sec. 5.4 与 Appendix D.4 绘制，并非论文原图）</text>
</svg>
