<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <style>.bg{fill:#fbf8f1}.box{fill:#fff;stroke:#d6cdbd;stroke-width:2}.slow{fill:#e7f0e9;stroke:#5d8a74}.fast{fill:#eee8f7;stroke:#8667a6}.cache{fill:#f8ead9;stroke:#b87939}.t{font:700 27px sans-serif;fill:#27231e}.h{font:700 21px sans-serif;fill:#27231e}.p{font:18px sans-serif;fill:#514b43}.s{font:16px monospace;fill:#645d54}.a{stroke:#756d62;stroke-width:3;marker-end:url(#m)}.dash{stroke:#8e8579;stroke-width:2;stroke-dasharray:7 7}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#756d62"/></marker></defs><rect class="bg" width="1200" height="560" rx="24"/>
  <text class="t" x="45" y="55">一条动作生成轨迹，为什么要分给两个 expert？</text>
  <rect class="box slow" x="45" y="105" width="460" height="190" rx="18"/><text class="h" x="70" y="145">慢流：Action Expert（约 5 Hz）</text><text class="p" x="70" y="182">看图像 + 语言 + 未来视觉语境</text><text class="s" x="70" y="218">x₁ = noise ── 6 Euler steps ──▶ x̂₀.₄</text><text class="p" x="70" y="256">职责：先决定“整体应该怎么做”</text>
  <rect class="box cache" x="545" y="105" width="260" height="190" rx="18"/><text class="h" x="570" y="145">边界缓存</text><text class="s" x="570" y="185">KV_lat</text><text class="s" x="570" y="215">+ KV_act@τ=.4</text><text class="p" x="570" y="255">冻结视觉语境</text>
  <rect class="box fast" x="845" y="105" width="310" height="190" rx="18"/><text class="h" x="870" y="145">快流：Tactile Expert（约 20 Hz）</text><text class="p" x="870" y="182">读实时触觉，不重跑视觉</text><text class="s" x="870" y="218">x̂₀.₄ ── 4 steps ──▶ x₀</text><text class="p" x="870" y="256">职责：按接触反馈修正细节</text>
  <path class="a" d="M505 200H535"/><path class="a" d="M805 200H835"/>
  <text class="h" x="45" y="360">16-step action chunk 内的异步更新时间</text><line class="dash" x1="105" y1="420" x2="1095" y2="420"/><circle cx="170" cy="420" r="12" fill="#8667a6"/><circle cx="430" cy="420" r="12" fill="#8667a6"/><circle cx="690" cy="420" r="12" fill="#8667a6"/><circle cx="950" cy="420" r="12" fill="#8667a6"/><text class="s" x="145" y="458">δ=0</text><text class="s" x="400" y="458">δ=4</text><text class="s" x="655" y="458">δ=8</text><text class="s" x="910" y="458">δ=12</text><text class="p" x="45" y="515">慢流提供稳定计划；四次快 tick 用最新触觉重新完成 τ=.4→0，相当于“同一计划，多次闭环纠偏”。</text>
</svg>
