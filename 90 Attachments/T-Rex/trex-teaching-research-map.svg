<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><style>.bg{fill:#fbf8f1}.c{fill:#fff;stroke:#d6cdbd;stroke-width:2}.core{fill:#f8ead9;stroke:#b87939;stroke-width:3}.t{font:700 27px sans-serif;fill:#27231e}.h{font:700 20px sans-serif;fill:#27231e}.p{font:17px sans-serif;fill:#514b43}.a{stroke:#8b8174;stroke-width:2.5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#8b8174"/></marker></defs><rect class="bg" width="1200" height="610" rx="24"/><text class="t" x="45" y="55">触觉机器人学习：以后调研时始终追问的五件事</text>
<rect class="core" x="455" y="235" width="290" height="130" rx="22"/><text class="h" x="500" y="285">触觉闭环策略</text><text class="p" x="488" y="325">感知接触 → 更新动作</text>
<rect class="c" x="55" y="105" width="310" height="125" rx="18"/><text class="h" x="80" y="143">① 触觉用来判断什么？</text><text class="p" x="80" y="178">接触 / 滑移 / 力 / 材质 / 形变</text><text class="p" x="80" y="207">状态估计还是直接控制？</text>
<rect class="c" x="445" y="85" width="310" height="125" rx="18"/><text class="h" x="470" y="123">② 原始信号怎样表示？</text><text class="p" x="470" y="158">标量、wrench、图像、事件流</text><text class="p" x="470" y="187">连续特征还是离散 token？</text>
<rect class="c" x="835" y="105" width="310" height="125" rx="18"/><text class="h" x="860" y="143">③ 动作怎样表示？</text><text class="p" x="860" y="178">joint / EEF / torque / chunk</text><text class="p" x="860" y="207">触觉改目标、残差还是生成轨迹？</text>
<rect class="c" x="155" y="420" width="360" height="125" rx="18"/><text class="h" x="180" y="458">④ 怎样融合到现有 VLA？</text><text class="p" x="180" y="493">early/late fusion、cross-attention</text><text class="p" x="180" y="522">独立 expert、缓存、异步频率</text>
<rect class="c" x="685" y="420" width="360" height="125" rx="18"/><text class="h" x="710" y="458">⑤ 用什么场景验证？</text><text class="p" x="710" y="493">视觉歧义、精细力控、滑移恢复</text><text class="p" x="710" y="522">跨物体/材质/传感器与延迟扰动</text>
<path class="a" d="M365 195L455 260"/><path class="a" d="M600 210V225"/><path class="a" d="M835 195L745 260"/><path class="a" d="M455 350L395 415"/><path class="a" d="M745 350L805 415"/></svg>
